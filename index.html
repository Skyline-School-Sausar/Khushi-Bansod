<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Khushi Bansod</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0D47A1, #42A5F5);
      color: white;
      text-align: center;
    }

    header {
      padding: 40px;
      background: rgba(0,0,0,0.3);
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
    }

    h1 {
      margin: 0;
      font-size: 40px;
    }

    .tagline {
      font-size: 18px;
      opacity: 0.9;
    }

    .profile {
      margin-top: 25px;
    }

    .profile img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 5px solid white;
      box-shadow: 0 0 15px rgba(255,255,255,0.5);
    }

    .card {
      margin: 25px auto;
      width: 80%;
      max-width: 700px;
      padding: 20px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }

    h2 {
      margin-bottom: 10px;
    }

    .music-box {
      margin-top: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      font-style: italic;
    }

    .projects {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    .project {
      background: white;
      color: black;
      width: 220px;
      margin: 10px;
      padding: 15px;
      border-radius: 15px;
      transition: 0.3s;
    }

    .project:hover {
      transform: scale(1.05);
    }

    .project img {
      width: 100%;
      border-radius: 10px;
    }

    footer {
      margin-top: 30px;
      padding: 15px;
      background: rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

<header>
  <h1>Khushi Bansod 💙</h1>
  <p class="tagline">Drawing 🎨 | Music Lover 🎧</p>
</header>

<div class="profile">
  <img src="https://via.placeholder.com/150" alt="Profile Photo">
</div>

<div class="card">
  <h2>My Interests</h2>
  <p>I love drawing creative things and listening to music.</p>

  <div class="music-box">
    <p>"Music makes everything better 🎶"</p>
  </div>
</div>

<div class="card">
  <h2>My Projects</h2>

  <div class="projects">
    <div class="project">
      <img src="https://via.placeholder.com/200">
      <h3>VR Headset</h3>
    </div>

    <div class="project">
      <img src="https://via.placeholder.com/200">
      <h3>Wind Propelled Car</h3>
    </div>

    <div class="project">
      <img src="https://via.placeholder.com/200">
      <h3>Neon LED Structure</h3>
    </div>
  </div>

</div>

<footer>
  <p>✨ Creative Girl | Summer Camp Project 💙</p>
</footer>

</body>
</html>
